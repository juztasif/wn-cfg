# Location : $HOME\AppData\Roaming\espanso\match\
matches:
  # --- General ---
  - trigger: ":newt"
    replace: |
      - trigger: "#"
        replace: "#"
        
  - trigger: ":newm"
    replace: |
      - trigger: "@#"
        replace: "#@gmail.com"

  - trigger: ":date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%d-%m-%Y"

  - trigger: ":tod"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%d %b %y"

  - trigger: ":ftod"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%d%b%y"


  # --- System Locations ---
  - trigger: ":dk/"
    replace: "%USERPROFILE%/Desktop"
  - trigger: ":dn/"
    replace: "%USERPROFILE%/Downloads"
  - trigger: ":dc/"
    replace: "%USERPROFILE%/Documents"
  - trigger: ":chst/"
    replace: "%USERPROFILE%/Documents/Cheatsheets"
  - trigger: ":pc/"
    replace: "%USERPROFILE%/Pictures"
  - trigger: ":srsh/"
    replace: "%USERPROFILE%/Pictures/Screenshots"
  - trigger: ":ms/"
    replace: "%USERPROFILE%/Music"
  - trigger: ":vi/"
    replace: "%USERPROFILE%/Videos"


# --- Email Shortcuts ---
  - trigger: "@#"
    replace: "#"

  # --- Google Services ---
  - trigger: ":yt"
    replace: "https://www.youtube.com/?persist_gl=1&gl=AT"

  - trigger: ":g0k"
    replace: "https://keep.google.com/u/0/"
  - trigger: ":g1k"
    replace: "https://keep.google.com/u/1/"

  - trigger: ":g0m"
    replace: "https://mail.google.com/mail/u/0/inbox"
  - trigger: ":g1m"
    replace: "https://mail.google.com/mail/u/1/#inbox"

  - trigger: "g0d"
    replace: "https://drive.google.com/drive/u/0/my-drive"
  - trigger: "g1d"
    replace: "https://drive.google.com/drive/u/1/my-drive"

  - trigger: "g0a"
    replace: "https://myaccount.google.com/?authuser=0"
  - trigger: "g1a"
    replace: "https://myaccount.google.com/?authuser=1"

  # --- Entertainment ---

  
  # --- AI & Chat Links ---
  - trigger: ":gk"
    replace: "https://grok.com/?referrer=website"
  - trigger: ":gpt"
    replace: "https://chatgpt.com/"
  - trigger: ":cp"
    replace: "https://copilot.microsoft.com/chats/"
  - trigger: ":ppy"
    replace: "https://www.perplexity.ai/"

  # --- Utilities ---
  - trigger: ":tmp"
    replace: "https://temp-mail.org/"
  - trigger: ":gt"
    replace: "https://translate.google.com/"
  - trigger: ":kk"
    replace: "https://kick.com/"
  - trigger: ":gh"
    replace: "https://github.com/"





